# Colaig — instance d'essai `colaig-test`, namespace `user-nic01asfr` (SSP Cloud).
#
# POURQUOI CE FICHIER EXISTE
# ----------------------------
# Le 30/08/2026, la configuration de cette instance n'existait NULLE PART hors du
# cluster : elle avait ete posee par `kubectl set env` / `set image`, jamais reportee
# dans la release. Les valeurs enregistrees disaient `storage.backend: local` quand
# l'instance tournait sur S3, et ne mentionnaient ni le modele d'OCR, ni la dimension
# des embeddings, ni l'auto-decouverte.
#
# Consequence directe : `helm upgrade --reuse-values` aurait rebascule le stockage sur
# `local` — la ou vivent le corpus et l'index — et eteint l'OCR au passage. Une
# instance dont la configuration n'est ecrite nulle part ne peut etre ni remontee, ni
# comparee, ni auditee.
#
# `tests/test_chart_decrit_l_instance.py` verifie que le rendu de ce fichier reproduit
# ce que le deploiement porte reellement. Tant que ce test passe,
# `helm upgrade -f values-colaig-test.yaml` est inoffensif : il reecrit ce qui est deja
# la.
#
# CE QUI N'EST PAS ICI, ET NE DOIT JAMAIS Y ETRE
# ------------------------------------------------
# Aucune cle. Les identifiants S3 et la cle LLM viennent du Secret `colaig-test`, monte
# par `envFrom`. Le depot est public ; un secret commite ne se rattrape pas par une
# suppression.
#
#     helm upgrade colaig-test deploy/helm/colaig -n user-nic01asfr \
#       -f deploy/helm/colaig/values-colaig-test.yaml

image:
  repository: ghcr.io/nic01asfr/colaig
  tag: tronc-9b2166c

# `Recreate` + volume persistant : les deux sont lies. Voir le commentaire de
# `strategy` dans le template — deux pods ne peuvent pas se partager le magasin de
# cles Matrix.
persistence:
  enabled: true
  size: 5Gi
  storageClass: rook-ceph-block

llm:
  backend: openai
  apiUrl: https://llm.lab.sspcloud.fr/api
  # Le Secret `colaig-test` porte LLM_API_KEY et les identifiants S3.
  existingSecret: colaig-test
  modelChat: qwen3-6-35b-moe
  modelEmbed: qwen3-embedding-8b
  modelOcr: chandra-ocr-2
  # 4096 : dimension servie par `qwen3-embedding-8b`, relevee sur l'endpoint le
  # 30/08/2026. Le catalogue de SSPCloud ne propose pas `bge-m3`.
  embeddingDim: 4096
  # Les embeddings viennent de l'endpoint, pas d'un modele local dans le pod.
  localEmbeddings: false

storage:
  backend: s3
  s3:
    endpointUrl: https://minio.lab.sspcloud.fr
    bucket: colaig
    region: us-east-1
    # VIDE, ET CE N'EST PAS UN OUBLI. `_full_key()` prefixe TOUS les chemins :
    # avec `prefix: colaig` — le defaut du chart — `/colaig-mesure-sst/...`
    # deviendrait `colaig/colaig-mesure-sst/...`, et le corpus comme l'index
    # disparaitraient de la vue de Colaig, qui verrait un espace vide sans la
    # moindre erreur. Le deploiement en service ne pose pas S3_PREFIX ; ce fichier
    # doit dire la meme chose.
    prefix: ""
    # accessKey / secretKey / sessionToken : dans le Secret, jamais ici.
    # Le chart n'ecrit S3_ACCESS_KEY que s'il est renseigne — le rendre vide
    # ECRASERAIT la valeur du Secret, `env` primant sur `envFrom`.

autoDiscover:
  enabled: true
  intervalSeconds: 120

messaging:
  backend: matrix

extraEnv:
  # PIPELINE AGENT — Analyseur, Orchestrateur, Synthetiseur, et la memoire de
  # conversation qui vient avec.
  #
  # Active le 01/09/2026, apres avoir leve ce qui l'en empechait : les deux agents
  # appelaient des modeles Mistral que l'endpoint SSPCloud ne sert pas. Le pipeline
  # ne pouvait donc pas fonctionner en service, et rien ne le disait — la mesure ne
  # le voyait pas, son harnais construisant les agents sans preciser de modele.
  #
  # Il reste global a l'instance : contrairement au garde-fou, la decision n'est pas
  # encore portee par l'espace. A faire si deux espaces d'une meme instance doivent
  # differer.
  COLAIG_AGENTS_ENABLED: "1"
  # TEMPERATURE DU SYNTHETISEUR — alignee sur celle a laquelle le coeur est mesure.
  #
  # Le defaut du code est 0.3, alors que la reference genere a 0.1. Les deux systemes
  # n'etaient donc pas compares a conditions egales, et l'ecart observe sur le refus
  # etait en partie mecanique : a 0.3 le pipeline refusait deux essais sur trois puis
  # repondait au troisieme — inconstance, pas incomprehension. Mesure du 02/09/2026 :
  # zero cas ou il manque le refus sur les trois essais.
  #
  # Sur du droit, la constance prime sur le naturel de la redaction. A remesurer : si
  # l'inconstance ne cede pas, la cause est ailleurs et ce reglage doit repartir.
  # Passee de 0,3 a 0,1 le 02/09, puis a 0 le 05/09. Le commentaire d'alors disait :
  # « A remesurer : si l'inconstance ne cede pas, la cause est ailleurs et ce reglage
  # doit repartir. » Elle n'a pas cede — et on sait maintenant d'ou elle vient.
  #
  # Sur les 18 cas qui basculent entre deux campagnes identiques (Analyseur et
  # Orchestrateur deja a 0), l'attribution est mesurable en comparant les passages
  # SERVIS de part et d'autre :
  #
  #   11  la recherche a servi autre chose
  #    7  MEME passage servi, redaction differente   <- le Synthetiseur
  #
  # Sept bascules sur dix-huit tiennent donc a la seule redaction. Sur du droit, la
  # constance prime sur le naturel : la meme question, avec les memes passages, doit
  # rendre la meme citation.
  COLAIG_SYNTHESISER_TEMPERATURE: "0"
  # LA DISPERSION ETAIT PLUS GRANDE QUE TOUT CE QU'ON COMPARAIT.
  #
  # Deux campagnes du 05/09/2026, MONTAGE STRICTEMENT IDENTIQUE, sans redeploiement
  # entre les deux :
  #
  #   cite l'attendu        68/113   puis   75/113
  #   article attendu servi 75/113   puis   84/113
  #
  # Sept et neuf points d'ecart pour zero changement. Or les ecarts qu'on cherchait a
  # trancher — recherche hybride, elargissement aux voisins, budget documentaire —
  # valaient trois a dix points. Aucune de ces comparaisons, faite a une repetition,
  # ne dit quoi que ce soit.
  #
  # La source n'est pas un reglage oublie : l'Analyseur et l'Orchestrateur etaient
  # deja a 0,1. Mais ce sont EUX qui ecrivent les requetes de recherche — mediane 2
  # par question, moyenne 2,8 — et une reformulation tiree autrement ramene d'autres
  # passages. Ce que « l'article est servi » mesure inclut donc le tirage.
  #
  # A 0, le decodage devient glouton. Ce n'est pas un determinisme parfait — le
  # batching cote serveur en laisse — mais c'est ce qui est atteignable ici.
  #
  # CE N'EST PAS QU'UN REGLAGE DE MESURE. L'Analyseur et l'Orchestrateur DECIDENT
  # (quelles requetes, quels outils) ; ils ne redigent pas. Un plan doit etre
  # reproductible : la meme question posee deux fois ne doit pas chercher ailleurs.
  COLAIG_ANALYSER_TEMPERATURE: "0"
  COLAIG_ORCHESTRATOR_TEMPERATURE: "0"
  # LES MODELES DES AGENTS, POSES PLUTOT QUE DEDUITS.
  #
  # Le Synthetiseur passe par `albert_model_medium` et la contextualisation par
  # `albert_model_light`, la ou l'Analyseur, l'Orchestrateur et le coeur RAG utilisent
  # `albert_model_chat`. Ces trois reglages valaient en dur des modeles Mistral que
  # l'endpoint SSPCloud ne sert pas : le pipeline aurait analyse, orchestre, puis
  # echoue au moment de rediger.
  #
  # Ils retombent desormais sur le modele de chat configure, donc convergent — mais
  # PAR REPLI, ce qui ne se voit nulle part. Les poser rend la decision lisible, et
  # `test_chart_decrit_l_instance` la protege : personne ne les fera diverger sans
  # que le test le dise.
  #
  # S'ils doivent un jour differer — un modele plus leger pour l'analyse, qui consomme
  # 62 % du temps du pipeline — ce sera une decision mesuree, ecrite ici.
  # DECOUPAGE PAR ARTICLE — le reglage qui decide de la couverture.
  #
  # Mesure sur le service, 04/09/2026, causes eliminees une a une :
  #
  #   fenetre k=5 sans prompt    refus  5/22   cite l'attendu 53/113
  #   fenetre k=5 avec prompt    refus 20/22   cite l'attendu 52/113
  #   article k=5 avec prompt    refus 22/22   cite l'attendu 97/113
  #
  # Le prompt explique tout le refus et RIEN de la couverture. Le k n'explique rien
  # (97/113 a k=5 comme a k=10), la memoire non plus. Restent 45 points imputables au
  # seul decoupage.
  #
  # « auto » detecte par document : par article si le texte en porte, fenetre sinon.
  # CHANGER CE REGLAGE IMPOSE DE REINDEXER — l'index existant suit l'ancien decoupage.
  COLAIG_CHUNK_STRATEGIE: auto
  # CONTEXTUALISATION DES PASSAGES — un prefixe de 1-2 phrases par chunk, ecrit par le
  # LLM a l'indexation, qui situe l'extrait dans son document et son domaine.
  #
  # POURQUOI MAINTENANT, ET PAS « PARCE QUE C'EST ECRIT ». Le diagnostic des neuf cas
  # qui echouent a tous les coups donne trois motifs, et deux d'entre eux sont des
  # confusions que seul le CONTEXTE du passage peut lever :
  #
  #   le bon numero, le mauvais cahier
  #     mp-129  attendu CCAG Travaux 3   servis CCAG Prestations intellectuelles 3 (x3)
  #     mp-070  attendu R2112-3          servis CCAG Travaux 1, Marches industriels 1…
  #     Le corpus porte QUATRE CCAG dont les articles sont numerotes pareil. Rien, dans
  #     le texte d'un article, ne dit de quel cahier il vient.
  #
  #   la partie legislative pour la reglementaire
  #     mp-010  attendu L2111-1  servi R2111-1     — un caractere d'ecart
  #     mp-057  attendu L2111-1  servis R2111-4, R2121-1, R2121-3
  #     Le principe est dans les « L », le chiffre dans les « R ».
  #
  # Le contextualiseur recoit deja le nom du document — verifie : il entre dans la
  # balise, avec l'extrait. Un prefixe « CCAG Travaux, chapitre 1er » distingue donc ce
  # que l'embedding du seul article ne distingue pas.
  #
  # CE QUE CELA COUTE : un appel LLM leger par chunk a l'indexation, soit 1149 pour cet
  # espace, et une reindexation complete. Rien au moment de la question.
  #
  # PEREMPTION : deux campagnes contre deux. Si les motifs ci-dessus ne cedent pas, le
  # reglage part comme sont partis l'elargissement aux voisins et le vivier elargi.
  COLAIG_CONTEXTUAL_CHUNKING_ENABLED: "true"
  # LE BUDGET DOCUMENTAIRE, EN JETONS.
  #
  # Il valait 6000 CODE EN DUR, sur une fenetre de 131072 relevee sur l'endpoint le
  # 04/09/2026 en poussant une requete jusqu'au refus. Porte a 20000 pour que
  # l'elargissement aux voisins s'ajoute au lieu de remplacer, il revient a son defaut
  # avec le retrait de celui-ci. Ce qui comptait etait qu'il devienne reglable.
  COLAIG_BUDGET_JETONS: "6000"
  # LE VIVIER A ETE MESURE (PLAN L4.1, « pool ~20 »), ET LE DEFAUT L'EMPORTE.
  #
  # Facteur 4 — 20 candidats pour k=5 — contre le defaut de 2, deux campagnes contre
  # deux :
  #
  #                          x2          x4
  #   article servi TOUJOURS   96          99
  #                 parfois     7           2
  #   article cite  TOUJOURS   86          86
  #   agregat              89, 91      89, 90
  #   latence mediane        10,8 s      11,5 s
  #
  # Le « 99 contre 96 » a l'air d'un gain ; le test apparie SUR LE SERVICE — ce que le
  # vivier modifie pourtant directement — donne p = 0,73 / 0,73 / 1,00 / 1,00. C'est de
  # la constance de tirage, pas un gain. Reste le cout : +0,7 s par question.
  # `COLAIG_RETRIEVER_POOL_FACTOR` n'est donc pas pose : rien ne le justifie.
  #
  # CE QUE LA MESURE MONTRE VRAIMENT : l'article attendu est servi dans 96 a 99 cas sur
  # 113, et cite dans 86. Le goulot n'est plus la recherche.
  #
  # RECHERCHE HYBRIDE — BM25 fusionne au vectoriel par RRF. Dernier reglage actif sans
  # preuve de ce lot : les campagnes du 04/09 qui l'ont juge portaient sur un
  # orchestrateur qui ne transmettait pas l'index lexical, puis sur une dispersion de
  # 20 % des cas. On la mesure ici a conditions egales.
  #
  # L'ETEINDRE NE DEMANDE PAS DE REINDEXER : `bm25.pkl` reste sur le stockage, il
  # cesse simplement d'etre consulte.
  COLAIG_HYBRID_SEARCH_ENABLED: "false"
  ALBERT_MODEL_MEDIUM: qwen3-6-35b-moe
  ALBERT_MODEL_LIGHT: qwen3-6-35b-moe
  MATRIX_HOMESERVER: https://matrix.agent.dev-durable.tchap.gouv.fr
  MATRIX_USERNAME: "@colaig.assistant-developpement-durable.gouv.fr:agent.dev-durable.tchap.gouv.fr"

ingress:
  enabled: true
  hostname: user-nic01asfr-colaig-test.user.lab.sspcloud.fr
